name: Build macOS Intel

on:
  workflow_dispatch:

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build_macos_intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set dev version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          DEV_VERSION="$TAG-$(date -u +%Y%m%d)"
          echo "FPTN_VERSION=$DEV_VERSION" >> $GITHUB_ENV
          echo "Version: $DEV_VERSION"

      - name: Install Conan
        run: |
          python3 -m venv $HOME/venv
          echo "$HOME/venv/bin" >> $GITHUB_PATH
          $HOME/venv/bin/pip install --upgrade pip "conan>=2.15,<3.0" macos-pkg-builder
          $HOME/venv/bin/conan profile detect --force

      # split restore/save so the cache is kept even when a later step fails: building the
      # dependencies from source takes about an hour and would otherwise be repeated
      # bump the v2 salt whenever the conan invocation or the profile below changes, a
      # restored cache keeps the packages built with the old settings
      - name: Restore conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: conan-v2-${{ hashFiles('conanfile.py', '.conan/**') }}
          restore-keys: conan-v2-

      # On Intel images Homebrew keeps libunistring in /usr/local, so libidn2's configure
      # links against it and its recipe never propagates that dependency - executables that
      # use libidn2 fail to link. This cache var makes configure skip the system copy and
      # compile the libunistring sources that libidn2 bundles instead. Applied after the
      # cache restore because a restored ~/.conan2 replaces the profile.
      - name: Patch conan profile
        run: |
          profile=$($HOME/venv/bin/conan profile path default)
          grep -q '^ac_cv_libunistring=no' "$profile" || printf '[buildenv]\nac_cv_libunistring=no\n' >> "$profile"
          grep -n -A2 '\[buildenv\]' "$profile"

      - name: Install dependencies
        run: |
          conan install . --output-folder=build --build=missing \
            -s compiler.cppstd=17 \
            -o with_gui_client=True \
            -o "qt/*:with_md4c=False" \
            -c "tools.build:defines=['QT_NO_INT128']" \
            --settings build_type=Release

      # fails here instead of at the link step, ~10 minutes later. the undefined u8_/u32_
      # symbols are no sign of trouble: they are references between the members of the same
      # archive, which the linker resolves. what matters is that the archive itself holds the
      # bundled libunistring objects that define them.
      - name: Check libidn2
        run: |
          libidn2=$(find ~/.conan2 -type f -name libidn2.a -path "*/p/lib/*" | head -n1)
          echo "found: $libidn2"
          test -n "$libidn2" || { echo "::error::no libidn2.a under ~/.conan2"; exit 1; }
          members=$(ar -t "$libidn2" | { grep -c '^libunistring_la' || true; })
          echo "bundled libunistring objects inside libidn2.a: $members"
          test "$members" -gt 0 || { echo "::error::libidn2.a has no bundled libunistring - the profile patch was not used, bump the cache key"; exit 1; }

      # gui/autoupdate.h turns on httplib's SSL support, which only compiles against boringssl
      # if the boringssl headers win the include search: they define OPENSSL_IS_BORINGSSL, which
      # switches httplib off the SSL_ctrl family that boringssl does not implement. Take the
      # package folders from the CMakeDeps files: fptn's own find_path and find_library calls are
      # free to pick the Homebrew copies in /usr/local instead, and an -I of that directory lands
      # before every -isystem of a conan package.
      - name: Locate conan packages
        run: |
          pkgfolder() {
            data=$(find build -maxdepth 2 -name "$1-*-data.cmake" | head -n1)
            test -n "$data" || return 1
            echo "generator file for $1: $data" >&2
            sed -n 's/^[[:space:]]*set([A-Za-z0-9_]*_PACKAGE_FOLDER_RELEASE "\(.*\)")/\1/p' "$data" | head -n1
          }
          openssl=$(pkgfolder OpenSSL) || { echo "::error::no OpenSSL-*-data.cmake under build/"; exit 1; }
          echo "boringssl package folder: $openssl"
          test -f "$openssl/include/openssl/base.h" || { echo "::error::no boringssl headers in $openssl"; exit 1; }
          brotli=$(pkgfolder brotli) || { echo "::error::no brotli-*-data.cmake under build/"; exit 1; }
          echo "brotli package folder: $brotli"
          test -f "$brotli/include/brotli/decode.h" || { echo "::error::no brotli headers in $brotli"; exit 1; }
          echo "OPENSSL_PKG=$openssl" >> $GITHUB_ENV
          echo "BROTLI_PKG=$brotli" >> $GITHUB_ENV

      # cmake puts every plain -I before every -isystem, and the dependencies of fptn contribute
      # -I /usr/local/include, which on this image holds Homebrew's openssl 3 headers. No include
      # directory or flag added to the project can beat that, so let the compiler itself open the
      # boringssl headers first - that is the openssl the whole build links anyway.
      - name: Wrap the compiler with the boringssl includes
        run: |
          printf '#!/bin/bash\nexec /usr/bin/c++ -isystem "%s/include" "$@"\n' "$OPENSSL_PKG" > "$HOME/bssl-first"
          chmod +x "$HOME/bssl-first"
          "$HOME/bssl-first" -dumpversion

      - name: Configure cmake
        run: |
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER="$HOME/bssl-first" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PKG" \
            -DBROTLI_INCLUDE_DIR="$BROTLI_PKG/include" \
            -DBROTLI_DEC_LIB="$BROTLI_PKG/lib/libbrotlidec.a" \
            -DBROTLI_COMMON_LIB="$BROTLI_PKG/lib/libbrotlicommon.a" \
            -DBROTLI_ENC_LIB="$BROTLI_PKG/lib/libbrotlienc.a"

      # the compile of tray.cpp succeeds either way, the difference shows up only at link time,
      # so compile that one translation unit for real out of compile_commands.json and look at
      # the openssl symbols it asks for. 35 seconds instead of the ten minutes the gui needs.
      - name: Probe the gui tray compile
        run: |
          grep -E 'BROTLI_|_OPENSSL|CMAKE_CXX_COMPILER:' build/CMakeCache.txt | head -25
          python3 -I - <<'PY'
          import json, shlex, subprocess, sys
          db = json.load(open("build/compile_commands.json"))
          e = [x for x in db if x["file"].endswith("gui/tray/tray.cpp")][0]
          cmd = shlex.split(e["command"])
          print("compiler:", cmd[0])
          i, n = 1, 0
          while i < len(cmd):
              t = cmd[i]
              if t in ("-I", "-isystem"):
                  n += 1
                  print("#%d %s %s" % (n, t, cmd[i + 1]))
                  i += 2
                  continue
              if t.startswith("-I") and len(t) > 2:
                  n += 1
                  print("#%d %s" % (n, t))
              i += 1
          args, skip = [], False
          for t in cmd:
              if skip:
                  skip = False
                  continue
              if t == "-o":
                  skip = True
                  continue
              args.append(t)
          r = subprocess.run(args + ["-o", "/tmp/tray_probe.o"], cwd=e["directory"],
                             capture_output=True, text=True)
          print("compile returncode:", r.returncode)
          print((r.stderr or "")[-3000:])
          if r.returncode:
              sys.exit(1)
          nm = subprocess.run(["nm", "-u", "/tmp/tray_probe.o"], capture_output=True, text=True)
          missing = [s for s in ("_SSL_CTX_ctrl", "_SSL_ctrl", "_SSL_get1_peer_certificate")
                     if s in nm.stdout]
          print("openssl symbols boringssl does not provide:", missing or "none")
          sys.exit(1 if missing else 0)
          PY

      # the .pkg contains only these two binaries; tests and fptn-server are not packaged.
      # no --parallel: the blocklist generator writes files shared by both client targets
      # and two concurrent runs of it delete each other's partial download.
      - name: Build
        run: |
          cd build
          cmake --build . --config Release --target fptn-client-cli
          cmake --build . --config Release --target fptn-client-gui

      - name: Build macOS pkg
        run: |
          cd build
          cmake --build . --config Release --target build-pkg

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FPTN-macOS-Intel
          path: "**/*.pkg"
          if-no-files-found: error

      - name: Save conan cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}

