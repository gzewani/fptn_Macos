name: Build macOS Intel

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на сайте GitHub

jobs:
  build_macos_intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set dev version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          DEV_VERSION="$TAG-intel-$(date -u +%Y%m%d)"
          echo "FPTN_VERSION=$DEV_VERSION" >> $GITHUB_ENV

      - name: Install tools (CMake, Ninja, Conan)
        run: |
          brew install cmake ninja
          pip3 install conan
          conan profile detect --force

      - name: Install dependencies
        run: |
          conan install . --output-folder=build --build=missing \
            -o with_gui_client=True \
            --settings build_type=Release \
            -s compiler.cppstd=17 \
            -c "tools.build:defines=['QT_NO_INT128']"

      - name: Build
        run: |
          cd build
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Build macOS pkg
        run: |
          cd build
          cmake --build . --target build-pkg

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FPTN-macOS-Intel
          path: |
            *.pkg
            build/*.pkg
          if-no-files-found: warn
