name: Build macOS Intel

on:
  workflow_dispatch:

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build_macos_intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set dev version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          DEV_VERSION="$TAG-$(date -u +%Y%m%d)"
          echo "FPTN_VERSION=$DEV_VERSION" >> $GITHUB_ENV
          echo "Version: $DEV_VERSION"

      - name: Install Conan
        run: |
          python3 -m venv $HOME/venv
          echo "$HOME/venv/bin" >> $GITHUB_PATH
          $HOME/venv/bin/pip install --upgrade pip "conan>=2.15,<3.0" macos-pkg-builder
          $HOME/venv/bin/conan profile detect --force

      # split restore/save so the cache is kept even when a later step fails: building the
      # dependencies from source takes about an hour and would otherwise be repeated
      # bump the v2 salt whenever the conan invocation or the profile below changes, a
      # restored cache keeps the packages built with the old settings
      - name: Restore conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: conan-v2-${{ hashFiles('conanfile.py', '.conan/**') }}
          restore-keys: conan-v2-

      # On Intel images Homebrew keeps libunistring in /usr/local, so libidn2's configure
      # links against it and its recipe never propagates that dependency - executables that
      # use libidn2 fail to link. This cache var makes configure skip the system copy and
      # compile the libunistring sources that libidn2 bundles instead. Applied after the
      # cache restore because a restored ~/.conan2 replaces the profile.
      - name: Patch conan profile
        run: |
          profile=$($HOME/venv/bin/conan profile path default)
          grep -q '^ac_cv_libunistring=no' "$profile" || printf '[buildenv]\nac_cv_libunistring=no\n' >> "$profile"
          grep -n -A2 '\[buildenv\]' "$profile"

      - name: Install dependencies
        run: |
          conan install . --output-folder=build --build=missing \
            -s compiler.cppstd=17 \
            -o with_gui_client=True \
            -o "qt/*:with_md4c=False" \
            -c "tools.build:defines=['QT_NO_INT128']" \
            --settings build_type=Release

      # fails here instead of at the link step, ~10 minutes later. the undefined u8_/u32_
      # symbols are no sign of trouble: they are references between the members of the same
      # archive, which the linker resolves. what matters is that the archive itself holds the
      # bundled libunistring objects that define them.
      - name: Check libidn2
        run: |
          libidn2=$(find ~/.conan2 -type f -name libidn2.a -path "*/p/lib/*" | head -n1)
          echo "found: $libidn2"
          test -n "$libidn2" || { echo "::error::no libidn2.a under ~/.conan2"; exit 1; }
          members=$(ar -t "$libidn2" | { grep -c '^libunistring_la' || true; })
          echo "bundled libunistring objects inside libidn2.a: $members"
          test "$members" -gt 0 || { echo "::error::libidn2.a has no bundled libunistring - the profile patch was not used, bump the cache key"; exit 1; }

      # gui/autoupdate.h turns on httplib's SSL support, which only compiles against
      # boringssl if the boringssl headers win the include search: they define
      # OPENSSL_IS_BORINGSSL, which switches httplib off the SSL_CTX_ctrl family that
      # boringssl does not implement. Take the package folder from the CMakeDeps file.
      - name: Locate conan openssl
        id: openssl
        run: |
          data=$(find build -maxdepth 2 -name "OpenSSL-*-data.cmake" | head -n1)
          echo "generator file: $data"
          test -n "$data" || { echo "::error::no OpenSSL-*-data.cmake under build/"; exit 1; }
          root=$(sed -n 's/^[[:space:]]*set([A-Za-z0-9_]*_PACKAGE_FOLDER_RELEASE "\(.*\)")/\1/p' "$data" | head -n1)
          echo "package folder: $root"
          test -f "$root/include/openssl/base.h" || { echo "::error::no boringssl headers in $root"; exit 1; }
          echo "OPENSSL_PKG=$root" >> $GITHUB_ENV

      # CMAKE_CXX_FLAGS would land after the -isystem list, so use the project() injection
      # point to put boringssl at the head of the include search instead.
      - name: Configure cmake
        run: |
          cd build
          printf 'include_directories(BEFORE SYSTEM "%s/include")\n' "$OPENSSL_PKG" > openssl-first.cmake
          cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PKG" \
            -DCMAKE_PROJECT_INCLUDE="$PWD/openssl-first.cmake"

      # preprocess a probe TU with the exact flags make uses for tray.cpp: -H prints the path
      # of every header the compiler opens, so this says which openssl the gui target really
      # compiles against. a real openssl there means the link fails, because cpp-httplib only
      # skips the SSL_ctrl family when the boringssl macro from openssl/base.h is defined.
      # it costs seconds, the build it replaces costs ten minutes.
      - name: Probe gui openssl headers
        run: |
          flags=build/src/fptn-client/CMakeFiles/fptn-client-gui.dir/flags.make
          test -f "$flags" || { echo "::error::no flags.make for fptn-client-gui"; exit 1; }
          grep -i openssl build/CMakeCache.txt | head -20
          defs=$(sed -n 's/^CXX_DEFINES = //p' "$flags")
          incs=$(sed -n 's/^CXX_INCLUDES = //p' "$flags")
          flgs=$(sed -n 's/^CXX_FLAGS = //p' "$flags")
          printf '#include <openssl/ssl.h>\n' > /tmp/probe.cpp
          c++ $defs $incs $flgs -fsyntax-only -H /tmp/probe.cpp 2>/tmp/probe.log \
            || { echo "::error::the probe did not compile"; tail -20 /tmp/probe.log; exit 1; }
          grep -E 'openssl/(ssl|base|opensslv)\.h' /tmp/probe.log | head -8
          macros=$(c++ $defs $incs $flgs -E -dM /tmp/probe.cpp 2>/dev/null || true)
          echo "$macros" | grep -E 'define OPENSSL_VERSION_NUMBER|OPENSSL_IS_BORINGSSL' || true
          echo "$macros" | grep -q 'OPENSSL_IS_BORINGSSL' \
            || { echo "::error::fptn-client-gui compiles against a real openssl but links the boringssl above - see the header paths it opened"; exit 1; }

      # the .pkg contains only these two binaries; tests and fptn-server are not packaged.
      # no --parallel: the blocklist generator writes files shared by both client targets
      # and two concurrent runs of it delete each other's partial download.
      - name: Build
        run: |
          cd build
          cmake --build . --config Release --target fptn-client-cli
          cmake --build . --config Release --target fptn-client-gui

      - name: Build macOS pkg
        run: |
          cd build
          cmake --build . --config Release --target build-pkg

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FPTN-macOS-Intel
          path: "**/*.pkg"
          if-no-files-found: error

      - name: Save conan cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}

